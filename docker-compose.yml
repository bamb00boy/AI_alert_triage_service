name: triage

x-app: &app
  image: triage-app:dev
  build:
    context: .
    dockerfile: docker/Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &app-env
    TRIAGE_DATABASE_URL: postgresql://triage_app:${APP_DB_PASSWORD:-triage_app}@postgres:5432/triage
    TRIAGE_MIGRATE_DATABASE_URL: postgresql://triage_owner:${OWNER_DB_PASSWORD:-triage_owner}@postgres:5432/triage
    TRIAGE_AMQP_URL: amqp://triage:${RABBITMQ_PASSWORD:-triage}@rabbitmq:5672/
    TRIAGE_OTLP_ENDPOINT: http://jaeger:4318
    TRIAGE_HMAC_SECRETS: ${TRIAGE_HMAC_SECRETS:-dev-only-change-me}
    TRIAGE_TI_URL: http://ti-service:8001
    TRIAGE_OLLAMA_URL: ${TRIAGE_OLLAMA_URL:-http://host.docker.internal:11434}
    TRIAGE_OLLAMA_MODEL: ${TRIAGE_OLLAMA_MODEL:-qwen3:4b-instruct}
    TRIAGE_LLAMACPP_URL: ${TRIAGE_LLAMACPP_URL:-http://host.docker.internal:8081}
    TRIAGE_LLAMACPP_MODEL: ${TRIAGE_LLAMACPP_MODEL:-llama-3.2-3b-instruct}
    TRIAGE_LLM_PRIMARY: ${TRIAGE_LLM_PRIMARY:-ollama}
    TRIAGE_LLM_SECONDARY: ${TRIAGE_LLM_SECONDARY:-llamacpp}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_USER: triage_owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:-triage_owner}
      POSTGRES_DB: triage
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-triage_app}
    volumes:
      - ./local/runtime/postgres:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_owner -d triage"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: triage
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-triage}
    volumes:
      - ./local/runtime/rabbitmq:/var/lib/rabbitmq
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5-0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Browser-facing URLs use localhost; containers reach the token/JWKS endpoints as keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/realm-triage.json:/opt/keycloak/data/import/realm-triage.json:ro
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    <<: *app
    command: ["python", "-m", "triage.migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  ingest-api:
    <<: *app
    command: ["uvicorn", "--factory", "triage.ingest.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }

  ti-service:
    <<: *app
    command: ["uvicorn", "--factory", "triage.ti_service.app:create_app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["127.0.0.1:8001:8001"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_completed_successfully }

  approval-ui:
    <<: *app
    command: ["uvicorn", "--factory", "triage.ui.app:create_app", "--host", "0.0.0.0", "--port", "8002"]
    ports: ["127.0.0.1:8002:8002"]
    restart: unless-stopped
    environment:
      <<: *app-env
      TRIAGE_OIDC_DISCOVERY_URL: http://keycloak:8080/realms/triage/.well-known/openid-configuration
      TRIAGE_UI_BASE_URL: http://localhost:8002
      TRIAGE_SESSION_SECRET: ${TRIAGE_SESSION_SECRET:-dev-only-session-secret}
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "-m", "triage.worker.main"]
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      <<: *app-env
      TRIAGE_DEMO_DELAY_SECONDS: ${TRIAGE_DEMO_DELAY_SECONDS:-0}
      TRIAGE_CONNECTOR_MODE: ${TRIAGE_CONNECTOR_MODE:-fixtures}
      TRIAGE_VIRUSTOTAL_API_KEY: ${TRIAGE_VIRUSTOTAL_API_KEY:-}
      TRIAGE_ABUSEIPDB_API_KEY: ${TRIAGE_ABUSEIPDB_API_KEY:-}
    volumes:
      - ./local/models/fastembed:/models/fastembed
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      ti-service: { condition: service_healthy }

