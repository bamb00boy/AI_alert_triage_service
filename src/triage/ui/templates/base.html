<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triage approvals</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root { --fg:#1d232b; --muted:#5f6b7a; --line:#dde2e8; --bg:#f6f7f9; --card:#fff;
            --mal:#b42318; --sus:#b54708; --ben:#067647; --accent:#1f5eff; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; color:var(--fg); background:var(--bg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:12px 24px;
             background:var(--card); border-bottom:1px solid var(--line); }
    header a { color:var(--fg); text-decoration:none; font-weight:600; }
    main { padding:20px 24px; max-width:1300px; margin:0 auto; }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); }
    th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
    tr:hover td { background:#fafbfc; }
    .tabs a { margin-right:14px; color:var(--muted); text-decoration:none; }
    .tabs a.on { color:var(--accent); font-weight:600; }
    .pill { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid var(--line); }
    .malicious { color:var(--mal); } .suspicious { color:var(--sus); } .benign { color:var(--ben); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 16px; }
    .card h2 { font-size:13px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    pre { white-space:pre-wrap; word-break:break-word; font-size:12px; margin:0; max-height:420px; overflow:auto; }
    button { font:inherit; padding:6px 12px; border-radius:5px; border:1px solid var(--line); background:#fff; cursor:pointer; }
    button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
    button.danger { color:var(--mal); }
    input, select { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:5px; }
    form.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
    #error { color:var(--mal); margin:8px 0; }
    .muted { color:var(--muted); }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <a href="/">Triage approvals</a>
  <span class="muted">{{ user.username }} · {{ user.roles | join(", ") }} · <a href="/logout">log out</a></span>
</header>
<main>
  <div id="error"></div>
  {% block content %}{% endblock %}
</main>
<script>
  document.body.addEventListener("htmx:responseError", function (e) {
    document.getElementById("error").textContent = "Error " + e.detail.xhr.status + ": " + e.detail.xhr.responseText;
  });
</script>
</body>
</html>
